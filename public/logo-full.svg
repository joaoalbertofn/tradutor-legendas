<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" width="720" height="176" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="360" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#0f1211" />
    </linearGradient>
    <linearGradient id="iconBg" x1="18" y1="16" x2="70" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141c1a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="iconGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(26 24) rotate(45) scale(48)">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="iconBorder" x1="16" y1="16" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="360" height="88" rx="20" fill="url(#cardBg)" />

  <!-- Mark -->
  <g transform="translate(12, 12)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#iconBg)" />
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#iconGlow)" />
    <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="url(#iconBorder)" stroke-width="1.5" />

    <rect x="12" y="25" width="24" height="6.5" rx="3.25" fill="#f4f4f5" />
    <rect x="40" y="25" width="12" height="6.5" rx="3.25" fill="#10b981" />

    <rect x="12" y="36.5" width="13" height="6.5" rx="3.25" fill="#facc15" />
    <rect x="29" y="36.5" width="23" height="6.5" rx="3.25" fill="#f4f4f5" />
  </g>

  <!-- Wordmark -->
  <text
    x="92"
    y="56"
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="-0.03em"
    fill="#f4f4f5"
  >Legendas<tspan fill="#34d399">BR</tspan></text>
</svg>
